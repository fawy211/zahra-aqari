name: aqari_app
description: "A new Flutter project for AqariApp."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # إدارة الحالة والربط
  flutter_riverpod: ^2.5.1 
  provider: ^6.1.2 
  
  # قاعدة البيانات والباك إند (Supabase)
  supabase_flutter: ^2.6.0
  
  # أدوات الوسائط والصور والملفات
  image_picker: ^1.1.2
  cross_file: ^0.3.4+2
  cached_network_image: ^3.3.0
  flutter_image_compress: ^2.3.0
  video_player: ^2.9.0
  video_compress: ^3.1.2
  
  # أدوات مساعدة ونظام
  url_launcher: ^6.3.2
  share_plus: ^10.1.4
  path_provider: ^2.1.3
  http: ^1.2.0
  
  # الترجمة والبيانات
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_gen: ^5.14.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

# إعدادات أيقونة التطبيق
flutter_launcher_icons:
  image_path: "app_icon.png"
  android: true
  ios: true